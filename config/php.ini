; Vue Blocks — PHP runtime overrides for the WordPress container.
; Mounted by docker-compose.yml to /usr/local/etc/php/conf.d/zz-vue-blocks.ini.
;
; Purpose: make theme-source PHP edits visible on the next browser
; request without a container restart (per research R8, FR-004).

; Always validate file timestamps; do not trust opcache's staleness.
opcache.validate_timestamps=1

; Re-check the timestamp on every request — the source tree is
; bind-mounted from the host and may change at any time.
opcache.revalidate_freq=0

; Keep opcache enabled; this only controls invalidation policy.
opcache.enable=1
opcache.enable_cli=0